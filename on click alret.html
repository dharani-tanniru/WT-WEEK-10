<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On click event function</title>
</head>
<body>
    <h2>Example for On Click Alert</h2>
    <button onclick="showMessage()">Click Me</button>
    <script>
        function showMessage(){
            alert("Hello students!welcome to javascript.");
        }
    </script>
</body>
</html>
